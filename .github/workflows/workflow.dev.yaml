name: Continuos Integration

on:
  pull_request:
    branches:
      - main

jobs:
  continuos-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Usinge Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.17.0'
      
      - name: Install dependencies
        run: yarn
      - name: Run tests
        run: yarn test
      - name: Run lint
        run: yarn lint